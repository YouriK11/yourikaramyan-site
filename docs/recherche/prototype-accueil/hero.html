<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    document.documentElement.classList.add("hero-intro");
    setTimeout(() => document.documentElement.classList.remove("hero-intro"), 4000);
  }
  window.__cls = 0; window.__shifts = 0;
  new PerformanceObserver((l) => { for (const e of l.getEntries()) if (!e.hadRecentInput) { window.__cls += e.value; window.__shifts++; } }).observe({ type: "layout-shift", buffered: true });
</script>
